<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speak My Medicine</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 22px; margin-bottom: 10px; }
  #reader { width: 100%; max-width: 400px; margin: 0 auto; border: 3px solid #4caf50; border-radius: 8px; overflow: hidden; }
  #result {
    margin-top: 20px;
    font-size: 20px;
    min-height: 100px;
    background: #222;
    border-radius: 8px;
    padding: 15px;
  }
  #speakAgainBtn, #restartBtn {
    margin-top: 15px;
    padding: 14px 24px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #4caf50;
    color: #fff;
    cursor: pointer;
    display: none;
  }
  #backBtn {
    position: fixed;
    top: 0; left: 0; right: 0;
    width: 100%;
    height: 60px;
    margin: 0;
    padding: 0 20px;
    font-size: 17px;
    border: none;
    border-radius: 0;
    background: #555;
    color: #fff;
    cursor: pointer;
    z-index: 500;
    box-sizing: border-box;
  }
  #status { margin-top: 10px; color: #aaa; font-size: 14px; }

  /* Full-screen language selection overlay */
  #langOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    z-index: 999;
  }
  .langZone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #zoneEn { background: #2e7d32; border-right: 2px solid #111; }
  #zoneHi { background: #1565c0; }
  .langZone.pending { outline: 4px dashed #fff; outline-offset: -8px; }
  .langZone.confirmed { background: #4caf50; }
  #langCaption {
    position: fixed; bottom: 20px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 14px;
    z-index: 1000; pointer-events: none;
  }

  /* Full-screen "tap to begin" gate. Shown first, before anything else.
     Browsers block speech/audio from firing on page load with no user
     interaction yet, so this exists purely to capture that first tap and
     use it to unlock audio — then it speaks the instructions for the
     language zones underneath it before getting out of the way. */
  #startGate {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    padding: 40px;
    box-sizing: border-box;
    cursor: pointer;
    z-index: 1001;
    -webkit-tap-highlight-color: transparent;
  }

  #mainApp { display: none; padding-top: 70px; } /* hidden until a language is picked; top padding clears the fixed back strip */

  /* visually hidden but still announced by screen readers */
  .srOnly {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>

  <div id="startGate" role="button" aria-label="Tap anywhere to begin. शुरू करने के लिए कहीं भी टैप करें।">
    Tap anywhere to begin<br>शुरू करने के लिए कहीं भी टैप करें
  </div>

  <!-- Full-screen tap zones: left half = English, right half = Hindi.
       Tapping either side speaks that language's name immediately as
       audio confirmation, then proceeds to the scanner after a short delay. -->
  <div id="langOverlay" style="display:none;">
    <div class="langZone" id="zoneEn" role="button" aria-label="English. Tap once to preview, tap again to confirm.">English</div>
    <div class="langZone" id="zoneHi" role="button" aria-label="हिंदी. सुनने के लिए एक बार टैप करें, चुनने के लिए दोबारा टैप करें।">हिंदी</div>
  </div>
  <div id="langStatus" class="srOnly" aria-live="polite"></div>
  <div id="langCaption" style="display:none;">Tap once to hear a language, tap again on the same side to select it</div>

  <div id="mainApp">
  <button id="backBtn" aria-label="Go back and choose a different language">↩️ Change language</button>
  <h1>📷 Point camera at the QR code on the medicine packet</h1>

  <div id="reader"></div>

  <div id="status">Waiting for camera...</div>

  <div id="result"></div>

  <button id="speakAgainBtn" aria-label="Speak the medicine information again">🔊 Speak Again</button>
  <button id="restartBtn" aria-label="Scan a new medicine packet">🔄 Scan Another</button>
  </div> <!-- end #mainApp -->

<script>
  // Warm up camera permission as early as possible. On a brand-new device,
  // the very first getUserMedia grant sometimes leaves the browser's camera
  // device list unsettled, causing html5-qrcode's first start() to fail
  // (fixed by a manual refresh). Requesting + immediately releasing a
  // camera stream here, before the user even picks a language, gives the
  // browser time to settle that list so the real start() later succeeds
  // on the first try.
  (function warmUpCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => {
        stream.getTracks().forEach(track => track.stop());
      })
      .catch(() => {
        // Permission denied or no camera yet — the real startScanner()
        // will surface this properly once the user reaches it.
      });
  })();

  const resultDiv = document.getElementById('result');
  const statusDiv = document.getElementById('status');
  const speakAgainBtn = document.getElementById('speakAgainBtn');
  const restartBtn = document.getElementById('restartBtn');

  let lastSentence = "";
  let html5QrCode = null;
  let currentLang = "en"; // "en" or "hi"
  let scannerActive = false; // tracks whether the camera is actually running right now

  const langOverlay = document.getElementById('langOverlay');
  const langCaption = document.getElementById('langCaption');
  const mainApp = document.getElementById('mainApp');
  const zoneEn = document.getElementById('zoneEn');
  const zoneHi = document.getElementById('zoneHi');
  const startGate = document.getElementById('startGate');

  // The gate's whole job: capture the first tap (required by browsers
  // before any audio can play), then speak the English instruction,
  // then the Hindi instruction, one after another — only revealing the
  // actual language zones once both have finished. If either utterance's
  // onend never fires (inconsistent across browsers), a fallback timer
  // moves things along anyway so the app can't get stuck on this screen.
  let gateHandled = false;
  function handleGateTap() {
    if (gateHandled) return; // ignore repeat taps while instructions are playing
    gateHandled = true;
    startGate.removeEventListener('click', handleGateTap);

    const revealZones = () => {
      startGate.style.display = 'none';
      langOverlay.style.display = 'flex';
      langCaption.style.display = 'block';
    };

    const enUtterance = speak("Tap the left side for English.", "en");
    let movedOn = false;
    const proceedToHindi = () => {
      if (movedOn) return;
      movedOn = true;
      const hiUtterance = speak("हिंदी के लिए दाईं तरफ टैप करें।", "hi");
      let revealed = false;
      const proceedToReveal = () => {
        if (revealed) return;
        revealed = true;
        revealZones();
      };
      hiUtterance.onend = proceedToReveal;
      setTimeout(proceedToReveal, 3000); // fallback if onend doesn't fire
    };
    enUtterance.onend = proceedToHindi;
    setTimeout(proceedToHindi, 3000); // fallback if onend doesn't fire
  }
  startGate.addEventListener('click', handleGateTap);

  // Best-effort ways to signal "there's a screen here, tap it" without
  // requiring the tap first:
  //  1. Try to speak the instruction immediately. Many browsers block
  //     audio until the user has interacted with the page at least once,
  //     so this may simply produce no sound — that's expected, not a bug,
  //     and is exactly why the tap-triggered version in handleGateTap
  //     above still exists as the reliable path.
  //  2. A short vibration, which works with the screen off or silent and
  //     needs no prior interaction. Not supported on iOS Safari.
  //  3. Move focus onto the gate so that if a real screen reader
  //     (TalkBack / VoiceOver) is already switched on, the phone's own
  //     voice announces the gate's label independently of our TTS.
  window.addEventListener('load', () => {
    try { speak("Tap anywhere to begin.", "en"); } catch (e) { /* ignore */ }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    startGate.setAttribute('tabindex', '-1');
    startGate.focus();
  });

  const labels = {
    en: { name: "Medicine name", dosage: "Dosage", frequency: "Frequency", warnings: "Warning" },
    hi: { name: "दवा का नाम", dosage: "खुराक", frequency: "कितनी बार लें", warnings: "चेतावनी" }
  };

  // Builds the sentence that will be spoken, from the decoded QR data.
  // Expects QR JSON to optionally carry per-language fields, e.g.:
  // {"name":"Paracetamol","name_hi":"पैरासिटामोल",
  //  "dosage":"500mg","dosage_hi":"500 मिलीग्राम",
  //  "frequency":"After food, twice daily","frequency_hi":"खाने के बाद, दिन में दो बार",
  //  "warnings":"...","warnings_hi":"..."}
  // If a "_hi" field is missing, it falls back to the English field automatically.
  function buildSentence(data, lang) {
    const L = labels[lang];
    const get = (field) => data[`${field}_${lang}`] || data[field]; // fallback to English text if translation missing

    let parts = [];
    if (data.name) parts.push(`${L.name}: ${get('name')}.`);
    if (data.dosage) parts.push(`${L.dosage}: ${get('dosage')}.`);
    if (data.frequency) parts.push(`${L.frequency}: ${get('frequency')}.`);
    if (data.warnings) parts.push(`${L.warnings}: ${get('warnings')}.`);
    if (parts.length === 0) {
      return "Scanned text says: " + JSON.stringify(data);
    }
    return parts.join(" ");
  }

  function speak(text, lang) {
    window.speechSynthesis.cancel(); // stop any ongoing speech
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.9;   // slightly slower, easier to follow
    utterance.pitch = 1;
    utterance.lang = (lang === "hi") ? "hi-IN" : "en-IN";
    window.speechSynthesis.speak(utterance);
    return utterance;
  }

  // Two-tap zone logic, as decided:
  //   1st tap on a zone  -> speaks that language's name as a PREVIEW only.
  //                         Nothing is committed yet. Tapping the other
  //                         zone instead just switches the preview.
  //   2nd tap on the SAME zone -> speaks a confirmation phrase, then once
  //                         that finishes, commits the language and opens
  //                         the scanner.
  // pendingLang tracks which zone (if any) is currently "armed" from a
  // first tap, waiting for its confirming second tap.
  let pendingLang = null;
  const langStatus = document.getElementById('langStatus');

  function commitLanguage(lang) {
    currentLang = lang;
    langOverlay.style.display = 'none';
    mainApp.style.display = 'block';
    startScanner();
  }

  function handleZoneTap(lang, zoneEl, otherZoneEl) {
    if (pendingLang !== lang) {
      // First tap on this zone (or a switch away from the other zone).
      otherZoneEl.classList.remove('pending', 'confirmed');
      zoneEl.classList.add('pending');
      pendingLang = lang;

      const previewText = (lang === 'hi') ? "हिंदी" : "English";
      const followUp = (lang === 'hi') ? "चुनने के लिए फिर से टैप करें" : "tap again to select";
      speak(`${previewText}. ${followUp}.`, lang);
      langStatus.innerText = `${previewText} — ${followUp}`;
    } else {
      // Second tap on the SAME zone that was already pending -> confirm.
      zoneEl.classList.add('confirmed');
      const confirmText = (lang === 'hi') ? "हिंदी चुना गया" : "English selected";
      langStatus.innerText = confirmText;
      const utterance = speak(confirmText, lang);

      utterance.onend = () => commitLanguage(lang);
      // Fallback in case onend never fires (some browsers are inconsistent):
      setTimeout(() => {
        if (langOverlay.style.display !== 'none') commitLanguage(lang);
      }, 2500);
    }
  }

  zoneEn.addEventListener('click', () => handleZoneTap('en', zoneEn, zoneHi));
  zoneHi.addEventListener('click', () => handleZoneTap('hi', zoneHi, zoneEn));

  function onScanSuccess(decodedText) {
    // Stop the camera once we get a successful scan
    html5QrCode.stop().then(() => {
      scannerActive = false;
      statusDiv.innerText = "Scan successful.";
    }).catch(() => {
      scannerActive = false;
    });

    let sentence;
    try {
      const data = JSON.parse(decodedText);
      sentence = buildSentence(data, currentLang);
    } catch (e) {
      // Not JSON — just speak the raw text from the QR code
      sentence = "Scanned text says: " + decodedText;
    }

    lastSentence = sentence;
    resultDiv.innerText = sentence;
    speak(sentence, currentLang);

    speakAgainBtn.style.display = "inline-block";
    restartBtn.style.display = "inline-block";
  }

  function onScanFailure(error) {
    // This fires continuously while no QR is found — ignore silently
  }

  function startScanner(isRetry) {
    resultDiv.innerText = "";
    speakAgainBtn.style.display = "none";
    restartBtn.style.display = "none";
    statusDiv.innerText = isRetry ? "Still setting up camera..." : "Waiting for camera...";

    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" }, // back camera
      { fps: 10, qrbox: 250 },
      onScanSuccess,
      onScanFailure
    ).then(() => {
      scannerActive = true;
      statusDiv.innerText = "Camera active. Point at the QR code.";
      // A blind user has no way to visually notice the "Change language"
      // strip, so say it exists and where it is (a fixed physical edge —
      // "the very top" — is something findable by touch alone, unlike a
      // button whose exact position they'd have to already know). Speak
      // this on every successful start (first try, after a retry, after
      // "Scan Another", after coming back from language selection) so it's
      // never a one-time announcement someone could have missed.
      speak(currentLang === 'hi'
        ? "कैमरा तैयार है। दवा के पैकेट पर मौजूद क्यूआर कोड की ओर कैमरा रखें। भाषा बदलने के लिए, स्क्रीन के सबसे ऊपरी हिस्से को कभी भी टैप करें।"
        : "Camera ready. Point at the QR code on the medicine packet. To change language, tap the very top edge of the screen anytime.", currentLang);
    }).catch(err => {
      scannerActive = false;
      if (!isRetry) {
        // First-attempt camera start failures are common on a brand-new
        // device (see warmUpCamera above) and usually succeed on a quick
        // retry, so try once more automatically instead of forcing the
        // person to manually refresh the whole page.
        statusDiv.innerText = "Setting up camera, please wait...";
        speak(currentLang === "hi" ? "कैमरा तैयार हो रहा है, कृपया प्रतीक्षा करें" : "Setting up camera, please wait", currentLang);
        setTimeout(() => startScanner(true), 1200);
      } else {
        statusDiv.innerText = "Camera error: " + err;
        speak(currentLang === "hi" ? "कैमरा शुरू नहीं हो सका। कृपया पेज को रीफ्रेश करें।" : "Camera could not start. Please refresh the page.", currentLang);
      }
    });
  }

  speakAgainBtn.addEventListener('click', () => {
    if (lastSentence) speak(lastSentence, currentLang);
  });

  restartBtn.addEventListener('click', () => {
    startScanner();
  });

  const backBtn = document.getElementById('backBtn');
  backBtn.addEventListener('click', () => {
    const finish = () => {
      scannerActive = false;
      // Clear the previous pick's visual state so it doesn't look "already
      // selected" the next time these zones are shown.
      zoneEn.classList.remove('pending', 'confirmed');
      zoneHi.classList.remove('pending', 'confirmed');
      pendingLang = null;

      speakAgainBtn.style.display = 'none';
      restartBtn.style.display = 'none';
      mainApp.style.display = 'none';
      langOverlay.style.display = 'flex';
      langCaption.style.display = 'block';

      speak(currentLang === 'hi'
        ? "भाषा चयन पर वापस जा रहे हैं"
        : "Returning to language selection", currentLang);
    };

    // Only call stop() if the scanner is actually running right now.
    // After a successful scan, onScanSuccess() already stopped it — calling
    // stop() again on an already-stopped scanner can throw synchronously
    // (not just reject a promise), which used to break this handler
    // entirely and leave the back button doing nothing after a scan.
    if (html5QrCode && scannerActive) {
      try {
        const stopResult = html5QrCode.stop();
        if (stopResult && typeof stopResult.then === 'function') {
          stopResult.then(finish).catch(finish);
        } else {
          finish();
        }
      } catch (e) {
        finish();
      }
    } else {
      finish();
    }
  });

  // Scanning starts only after a language is chosen (see handleZoneTap above),
  // not automatically on page load.
</script>

</body>
</html>
